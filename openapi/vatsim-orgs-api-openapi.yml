openapi: 3.2.0
info:
  title: VATSIM Orgs API
  version: '2.0'
  description: The VATSIM API is a RESTful API that provides access to data from the VATSIM network.
  termsOfService: https://vatsim.net/docs/policy/user-agreement
  contact:
    name: VATSIM Technology Team
    email: tech@vatsim.net
servers:
- url: https://api.vatsim.net
  description: Production
tags:
- name: Orgs
paths:
  /v2/orgs/subdivision/{subdivision_id}:
    get:
      operationId: orgs_api_subdivision_roster
      summary: List a subdivision's members
      parameters:
      - in: path
        name: subdivision_id
        schema:
          title: Subdivision Id
          type: string
        required: true
      - in: query
        name: include_inactive
        schema:
          title: Include Inactive
          default: false
          type: boolean
        required: false
      - in: query
        name: limit
        schema:
          title: Limit
          default: 100
          minimum: 1
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          title: Offset
          default: 0
          minimum: 0
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMember'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      description: Returns a list of all active members of a subdivision.
      tags:
      - Orgs
      security:
      - APIKeyAuth: []
      - LegacyAuth: []
  /v2/orgs/division/{division_id}:
    get:
      operationId: orgs_api_division_roster
      summary: List a division's members
      parameters:
      - in: path
        name: division_id
        schema:
          title: Division Id
          type: string
        required: true
      - in: query
        name: include_inactive
        schema:
          title: Include Inactive
          default: false
          type: boolean
        required: false
      - in: query
        name: limit
        schema:
          title: Limit
          default: 100
          minimum: 1
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          title: Offset
          default: 0
          minimum: 0
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMember'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      description: Returns a list of all active members of a division.
      tags:
      - Orgs
      security:
      - APIKeyAuth: []
      - LegacyAuth: []
components:
  schemas:
    PagedMember:
      title: PagedMember
      type: object
      properties:
        items:
          title: Items
          type: array
          items:
            $ref: '#/components/schemas/Member'
        count:
          title: Count
          type: integer
      required:
      - items
      - count
    NotFound:
      title: NotFound
      type: object
      properties:
        detail:
          title: Detail
          default: Not Found.
          type: string
    Member:
      title: Member
      description: Only to be used for response validation as it is unprotected.
      type: object
      properties:
        id:
          title: Id
          type: integer
        name_first:
          title: Name First
          type: string
        name_last:
          title: Name Last
          type: string
        email:
          title: Email
          type: string
        countystate:
          title: Countystate
          type: string
        country:
          title: Country
          type: string
        rating:
          title: Rating
          type: integer
        pilotrating:
          title: Pilotrating
          default: 0
          type: integer
        militaryrating:
          title: Militaryrating
          default: 0
          type: integer
        susp_date:
          title: Susp Date
          type: string
          format: date-time
        reg_date:
          title: Reg Date
          type: string
          format: date-time
        region_id:
          title: Region Id
          type: string
        division_id:
          title: Division Id
          type: string
        subdivision_id:
          title: Subdivision Id
          type: string
        lastratingchange:
          title: Lastratingchange
          type: string
          format: date-time
      required:
      - id
      - countystate
      - country
      - rating
      - reg_date
      - region_id
      - division_id
    Message:
      title: Message
      description: Requests that produce an error use this schema
      type: object
      properties:
        message:
          title: Message
          type: string
      required:
      - message
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      description: Preferred method of authentication for APIv2. Use your APIv2 key here.
      in: header
      name: X-API-Key
    LegacyAuth:
      type: apiKey
      description: "\nPreserved for backwards compatibility with API v1, **not recommended** for new integrations.\n\nThe same API key used in the `X-API-Key` header should be used here, but prefixed with `Token `.\n    "
      in: header
      name: Authorization
